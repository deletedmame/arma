<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology - Grade 9</title>
    <link rel="stylesheet" href="../../styles/home.css">
    <link rel="stylesheet" href="../../styles/quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chapters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin: 30px 0; }
        .chapter-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); transition: all 0.3s ease; position: relative; }
        .chapter-title { font-size:1.3rem; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom: 15px; }
        .chapter-actions { display:flex; gap:10px; margin-bottom:15px; }
        .action-btn { flex:1; padding:12px; border:none; border-radius:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; color:inherit; }
        .note-btn { background: var(--accent); color: var(--text); border:1px solid var(--border); }
        .quiz-btn { background: var(--primary); color:white; }
        .final-card { background: linear-gradient(135deg, var(--primary-soft), var(--card)); border:2px solid var(--primary); margin-top:20px; }
        .chapter-status { display:flex; justify-content:space-between; align-items: center; padding-top:12px; border-top:1px solid var(--border-soft); font-size:0.9rem; }
        .score-badge { display:flex; align-items:center; gap:8px; background:var(--primary-soft); padding:5px 12px; border-radius:30px; font-weight:600; min-height: 30px; }
        .rating-mini { height: 20px; width: auto; }
        .custom-back-btn { position: fixed; top: 15px; left: 20px; background: var(--primary); color:white; padding:10px 15px; border-radius:12px; cursor:pointer; z-index:999; display:flex; align-items:center; gap:5px; font-weight:600; border:none; text-decoration: none; }
        .custom-back-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Announcements Section */
        .announcements-section {
            margin-top: 30px;
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
        }
        .message-item {
            background: var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
            transition: all 0.2s;
        }
        .message-item:hover {
            transform: translateX(3px);
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .message-badge {
            font-size: 10px;
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .message-time {
            font-size: 10px;
            color: var(--text-light);
        }
        .message-text {
            margin: 0;
            color: var(--text);
            word-wrap: break-word;
            line-height: 1.4;
        }
        .view-all-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }
        .view-all-link:hover {
            text-decoration: underline;
        }
        .no-messages {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
        }
        .no-messages i {
            font-size: 40px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<a href="../../index.html" class="custom-back-btn"><i class="fas fa-arrow-left"></i> </a>

<div class="account-icon" id="accountIcon">
    <div class="account-icon-link">👤</div>
    <div class="account-dropdown" id="accountDropdown">
        <div class="dropdown-header">
            <div class="current-user">
                <div class="user-avatar">👤</div>
                <div class="user-info-dropdown">
                    <div class="user-name-dropdown">Loading...</div>
                    <div class="user-grade-dropdown">Grade</div>
                </div>
            </div>
        </div>
        <div class="dropdown-menu">
            <div class="dropdown-item">
                <i class="fas fa-palette"></i>
                <span>Theme</span>
                <select id="theme-selector" class="theme-select">
                    <option value="light">☀️ Light</option>
                    <option value="dark">🌙 Dark</option>
                </select>
            </div>
            <div class="dropdown-divider"></div>
            <!-- Messages Link in Dropdown -->
            <a href="../../chat.html" class="dropdown-item" style="text-decoration: none;">
                <i class="fas fa-comment-dots"></i>
                <span>Messages</span>
            </a>
            <div class="dropdown-divider"></div>
            <button onclick="logout()" class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
</div>

<div class="container">
    <h1>🌿 Biology - Grade 9</h1>
    <div class="chapters-grid" id="chapters-grid"></div>

    <div class="chapter-card final-card">
        <div class="chapter-title"><i class="fas fa-graduation-cap"></i> Final Exam</div>
        <div class="chapter-actions">
            <a href="final-exam/index.html" class="action-btn quiz-btn" style="width:100%">
                <i class="fas fa-pencil-alt"></i> Take Final Exam
            </a>
        </div>
        <div class="chapter-status">
            <span>Final Assessment</span>
            <div class="score-badge" id="home-final-score">—</div>
        </div>
    </div>

    <!-- Announcements Section -->
    <div class="announcements-section">
        <h3 style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-bullhorn" style="color: var(--primary);"></i> 
            Latest Announcements
        </h3>
        <div id="announcementsList" style="max-height: 300px; overflow-y: auto;">
            <div class="no-messages">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading announcements...</p>
            </div>
        </div>
        <a href="../../chat.html" class="view-all-link">
            View all messages <i class="fas fa-arrow-right"></i>
        </a>
    </div>
</div>

<script type="module">
    import { auth, db, collection, query, where, getDocs, onAuthStateChanged, onSnapshot, orderBy } from '../../firebase-config.js';

    // Check user session
    const sessionData = localStorage.getItem("current_user_session");
    if (!sessionData) {
        window.location.href = "../../signin.html";
    }

    const currentUser = JSON.parse(sessionData);
    const USER_ID = currentUser.id;
    const SUBJECT_CODE = '9bio';
    const TOTAL_QUESTIONS_PER_CHAPTER = 10;

    // Chapters configuration
    const chapters = [
        { id: 1, name: 'Introduction to Biology', icon: 'fa-leaf', chapterKey: 'ch1', notePath: 'ch-1/note/note.html', quizPath: 'ch-1/quiz/index.html' },
        { id: 2, name: 'Cells and Classification', icon: 'fa-dna', chapterKey: 'ch2', notePath: 'ch-2/note/note.html', quizPath: 'ch-2/quiz/index.html' },
    ];

    // Format time
    function formatTime(date) {
        if (!date || isNaN(date.getTime())) {
            return 'Unknown date';
        }
        
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        
        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins} minute${diffMins > 1 ? 's' : ''} ago`;
        if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
        if (diffDays === 1) return 'Yesterday';
        if (diffDays < 7) return `${diffDays} days ago`;
        
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        return date.toLocaleDateString(undefined, options);
    }

    // Fetch quiz results from Firestore
    async function fetchQuizResults() {
        try {
            const q = query(
                collection(db, "quiz_results"),
                where("studentId", "==", USER_ID),
                where("subjectCode", "==", SUBJECT_CODE)
            );
            
            const querySnapshot = await getDocs(q);
            const results = {};
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const chapter = data.chapter;
                const score = data.score;
                const totalQuestions = data.totalQuestions;
                
                if (!results[chapter] || (data.completedAt?.toDate?.() > results[chapter].date)) {
                    results[chapter] = { score: score, total: totalQuestions, date: data.completedAt?.toDate?.() || new Date() };
                }
            });
            
            return results;
        } catch (error) {
            console.error("Error fetching results:", error);
            return {};
        }
    }

    // Update badge display
    function updateBadge(elementId, result, totalQuestions) {
        const element = document.getElementById(elementId);
        if (!element) return;
        
        if (!result) {
            element.innerHTML = '—';
            return;
        }
        
        const score = result.score;
        const total = result.total || totalQuestions;
        const percentage = (score / total) * 100;
        let rating = Math.round((percentage / 100) * 50 / 5) * 5;
        if (rating > 50) rating = 50;
        if (rating < 0) rating = 0;
        
        element.innerHTML = `
            <i class="fas fa-star" style="color: #ffca28;"></i>
            ${score}/${total}
            <img src="../../images/ratings/rating-${rating}.png" class="rating-mini" draggable="false" onerror="this.style.display='none'">
        `;
    }

    // Load dashboard
    async function loadDashboard() {
        // Show loading spinners
        chapters.forEach(ch => {
            const badge = document.getElementById(`home-score${ch.id}`);
            if (badge) badge.innerHTML = '<div class="loading-spinner"></div>';
        });
        const finalBadge = document.getElementById('home-final-score');
        if (finalBadge) finalBadge.innerHTML = '<div class="loading-spinner"></div>';
        
        const results = await fetchQuizResults();
        
        // Update chapter badges
        chapters.forEach(ch => {
            updateBadge(`home-score${ch.id}`, results[ch.chapterKey], TOTAL_QUESTIONS_PER_CHAPTER);
        });
        
        // Update final exam badge
        updateBadge('home-final-score', results['final'], 40);
    }

    // Load announcements
    function loadAnnouncements() {
        const q = query(
            collection(db, "admin_messages"),
            orderBy("timestamp", "desc")
        );
        
        onSnapshot(q, (snapshot) => {
            const messages = [];
            snapshot.forEach(doc => {
                const msg = doc.data();
                if (msg.recipient === 'all' || msg.recipient === currentUser.id) {
                    messages.push({ id: doc.id, ...msg });
                }
            });
            displayAnnouncements(messages.slice(0, 5));
        }, (error) => {
            console.error("Error loading announcements:", error);
            const container = document.getElementById('announcementsList');
            if (container) {
                container.innerHTML = '<div class="no-messages"><i class="fas fa-exclamation-circle"></i><p>Failed to load announcements.</p></div>';
            }
        });
    }

    function displayAnnouncements(messages) {
        const container = document.getElementById('announcementsList');
        if (!container) return;
        
        if (messages.length === 0) {
            container.innerHTML = `
                <div class="no-messages">
                    <i class="fas fa-inbox"></i>
                    <p>No announcements yet</p>
                    <p style="font-size: 12px;">Check back later for updates</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = messages.map(msg => {
            let date = msg.timestamp?.toDate?.() || new Date(msg.timestamp);
            const timeStr = formatTime(date);
            const isAnnouncement = msg.recipient === 'all';
            
            return `
                <div class="message-item">
                    <div class="message-header">
                        <span class="message-badge">${isAnnouncement ? '📢 Announcement' : '🔒 Private'}</span>
                        <span class="message-time">${timeStr}</span>
                    </div>
                    <p class="message-text">${escapeHtml(msg.message)}</p>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Build UI
    function buildUI() {
        const grid = document.getElementById('chapters-grid');
        grid.innerHTML = '';
        
        chapters.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'chapter-card';
            card.innerHTML = `
                <div class="chapter-title"><i class="fas ${ch.icon}"></i> ${ch.name}</div>
                <div class="chapter-actions">
                    <a href="${ch.notePath}" class="action-btn note-btn"><i class="fas fa-book-open"></i> Notes</a>
                    <a href="${ch.quizPath}" class="action-btn quiz-btn"><i class="fas fa-question-circle"></i> Quiz</a>
                </div>
                <div class="chapter-status">
                    <div>Progress</div>
                    <div class="score-badge" id="home-score${ch.id}">—</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Logout function
    window.logout = async () => {
        const { signOut } = await import('../../firebase-config.js');
        await signOut(auth);
        localStorage.removeItem("current_user_session");
        window.location.href = "../../signin.html";
    };

    // Initialize
    buildUI();
    loadDashboard();
    loadAnnouncements();
    
    // Refresh scores when page becomes visible
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            loadDashboard();
            loadAnnouncements();
        }
    });
    
    // Refresh every 30 seconds
    setInterval(() => {
        loadDashboard();
        loadAnnouncements();
    }, 30000);
    
    // Update user info in dropdown
    const nameDisplay = document.querySelector('.user-name-dropdown');
    const gradeDisplay = document.querySelector('.user-grade-dropdown');
    const avatarDisplay = document.querySelector('.user-avatar');
    
    if (nameDisplay) nameDisplay.textContent = currentUser.name;
    if (gradeDisplay) gradeDisplay.textContent = `Grade ${currentUser.grade}`;
    if (avatarDisplay) avatarDisplay.textContent = currentUser.name?.charAt(0).toUpperCase() || '?';
    
    // Theme
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.body.setAttribute('data-theme', savedTheme);
    const themeSelect = document.getElementById('theme-selector');
    if (themeSelect) {
        themeSelect.value = savedTheme;
        themeSelect.onchange = (e) => {
            document.body.setAttribute('data-theme', e.target.value);
            localStorage.setItem('theme', e.target.value);
        };
    }
    
    // Dropdown
    const accountIcon = document.getElementById('accountIcon');
    const accountDropdown = document.getElementById('accountDropdown');
    if (accountIcon) {
        accountIcon.onclick = (e) => {
            e.stopPropagation();
            if (accountDropdown) accountDropdown.classList.toggle('active');
        };
    }
    if (accountDropdown) {
        accountDropdown.onclick = (e) => e.stopPropagation();
        document.onclick = () => {
            if (accountDropdown) accountDropdown.classList.remove('active');
        };
    }
</script>
<script>
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        history.go(1);
    };
</script>
</body>
</html>
