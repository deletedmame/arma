<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics - Grade 9</title>
    <link rel="stylesheet" href="../../styles/home.css">
    <link rel="stylesheet" href="../../styles/quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .chapters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin: 30px 0; }
        .chapter-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); transition: all 0.3s ease; position: relative; }
        .chapter-title { font-size:1.3rem; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom: 15px; }
        .chapter-actions { display:flex; gap:10px; margin-bottom:15px; }
        .action-btn { flex:1; padding:12px; border:none; border-radius:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; color:inherit; }
        .note-btn { background: var(--accent); color: var(--text); border:1px solid var(--border); }
        .quiz-btn { background: var(--primary); color:white; }
        .final-card { background: linear-gradient(135deg, var(--primary-soft), var(--card)); border:2px solid var(--primary); margin-top:20px; }
        .chapter-status { display:flex; justify-content:space-between; align-items: center; padding-top:12px; border-top:1px solid var(--border-soft); font-size:0.9rem; }
        .score-badge { display:flex; align-items:center; gap:8px; background:var(--primary-soft); padding:5px 12px; border-radius:30px; font-weight:600; min-height: 30px; }
        .rating-mini { height: 20px; width: auto; }

        .custom-back-btn { position: fixed; top: 15px; left: 20px; background: var(--primary); color:white; padding:10px 15px; border-radius:12px; cursor:pointer; z-index:999; display:flex; align-items:center; gap:5px; font-weight:600; border:none; }
    </style>
</head>
<body>
    <!-- Works from any directory -->
<script type="module" src="/assessment-redirect.js"></script>

<button class="custom-back-btn" onclick="goBack()">
    <i class="fas fa-arrow-left"></i>
</button>

<div class="account-icon" id="accountIcon">
    <div class="account-icon-link">👤</div>
    <div class="account-dropdown" id="accountDropdown">
        <div class="dropdown-header">
            <div class="current-user">
                <div class="user-avatar">👤</div>
                <div class="user-info-dropdown">
                    <div class="user-name-dropdown">Loading...</div>
                    <div class="user-grade-dropdown">Grade</div>
                </div>
            </div>
        </div>

        <div class="dropdown-menu">
            <div class="dropdown-item">
                <i class="fas fa-palette"></i>
                <span>Theme</span>
                <select id="theme-selector" class="theme-select">
                    <option value="light">☀️ Light</option>
                    <option value="dark">🌙 Dark</option>
                </select>
            </div>

            <div class="dropdown-divider"></div>

            <button onclick="logout()" class="dropdown-item">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>
</div>

<div class="container">
    <h1>⚡ Physics - Grade 9</h1>

    <div class="chapters-grid" id="chapters-grid"></div>

    <!-- Final Exam -->
    <div class="chapter-card final-card">
        <div class="chapter-title">
            <i class="fas fa-bolt"></i> Final Exam
        </div>

        <div class="chapter-actions">
            <a href="final-exam/index.html" class="action-btn quiz-btn" style="width:100%">
                <i class="fas fa-pencil-alt"></i> Take Final Exam
            </a>
        </div>

        <div class="chapter-status">
            <span id="final-status-text">Final Assessment</span>
            <div class="score-badge" id="home-final-score">—</div>
        </div>
    </div>
</div>

<script type="module" src="script.js"></script>

<script>
    function goBack() {
    window.history.back();
}
    function logout() {
        localStorage.removeItem("current_user_session");
        window.location.href = "../../profile.html";
    }

    // ✅ Physics Chapters
    const chapters = [
        { id:1, name:'Force & Newton Laws', notePath:'ch-2/note/note.html', quizPath:'ch-2/quiz/index.html' },
                { id:2, name:'Motion', icon:'fa-road', notePath:'ch-1/note/note.html', quizPath:'ch-1/quiz/index.html' }

    ];

    const grid = document.getElementById('chapters-grid');

    chapters.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'chapter-card';

        card.innerHTML = `
            <div class="chapter-title">
                <i class="fas ${ch.icon}"></i> ${ch.name}
            </div>

            <div class="chapter-actions">
                <a href="${ch.notePath}" class="action-btn note-btn">
                    <i class="fas fa-book-open"></i> Notes
                </a>

                <a href="${ch.quizPath}" class="action-btn quiz-btn">
                    <i class="fas fa-question-circle"></i> Quiz
                </a>
            </div>

            <div class="chapter-status">
                <div>Progress</div>
                <div class="score-badge" id="home-score${ch.id}">—</div>
            </div>
        `;

        grid.appendChild(card);
    });

    // Dropdown & Theme
    document.addEventListener('DOMContentLoaded', () => {
        const icon = document.getElementById('accountIcon');
        const dropdown = document.getElementById('accountDropdown');
        const themeSelector = document.getElementById('theme-selector');

        icon.addEventListener('click', e => {
            e.stopPropagation();
            dropdown.classList.toggle('active');
        });

        dropdown.addEventListener('click', e => e.stopPropagation());

        document.addEventListener('click', () => {
            dropdown.classList.remove('active');
        });

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        themeSelector.value = savedTheme;

        themeSelector.addEventListener('change', (e) => {
            document.body.setAttribute('data-theme', e.target.value);
            localStorage.setItem('theme', e.target.value);
        });

        const sessionData = localStorage.getItem("current_user_session");
        if (sessionData) {
            const user = JSON.parse(sessionData);

            document.querySelector('.user-name-dropdown').textContent = user.name;
            document.querySelector('.user-grade-dropdown').textContent = `Grade ${user.grade}`;
            document.querySelector('.user-avatar').textContent = user.name.charAt(0).toUpperCase();
        }
    });

    // Disable back navigation
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        history.go(1);
    };
</script>

</body>
</html>
